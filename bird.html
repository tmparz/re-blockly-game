<header><a href="./">← Blocky Easy</a><div><h1>Bird 飛鳥任務 · iPad 觸控版</h1><p>點角度積木可旋轉圓盤調整方向；點座標數字可使用螢幕鍵盤輸入。先吃到蟲，再飛回鳥巢。</p></div></header>

  const params = new URLSearchParams(location.search);

  const level = Math.min(10, Math.max(1, Number(params.get('level')) || 1));
  document.getElementById('game').src = `bird-game/bird.html?lang=${lang}&level=${level}`;
