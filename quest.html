<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Quest Lab · Blocky Easy</title>
  <meta name="description" content="Grade 3 coding missions: debugging, functions and variables with touch-friendly Blockly blocks." />
  <link rel="stylesheet" href="styles/quest.css" />
</head>
<body class="quest-app">
  <header class="topbar">
    <a class="home" href="./" title="100 Levels" aria-label="100 Levels">🏠</a>
    <span class="brand">Quest Lab</span>
    <nav class="unit-tabs" id="unitTabs" aria-label="Units"></nav>
    <div class="top-right">
      <a class="icon-link" href="story.html">🎬 <span data-i18n="navStory">Story Lab</span></a>
      <a class="icon-link" href="course.html">📘 <span data-i18n="navCourse">Course Plan</span></a>
      <div class="total-stars" title="Stars">⭐ <strong id="totalStars">0</strong></div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
    </div>
  </header>

  <main class="quest-shell">
    <section class="panel mission-panel" aria-labelledby="missionTitle">
      <div class="mission-head">
        <div class="mission-dots" id="missionDots" role="group" aria-label="Missions"></div>
        <p class="kicker" id="missionKicker"></p>
        <h1 id="missionTitle"></h1>
        <p class="story" id="missionStory"></p>
        <div class="chips"><span class="chip" id="limitChip"></span></div>
        <details class="hint" id="hintBox">
          <summary>💡 <span data-i18n="hint">Need a hint?</span></summary>
          <p id="missionHint"></p>
        </details>
      </div>
      <div class="map-row">
        <div class="map-tabs" id="mapTabs" hidden></div>
        <label class="speed" title="Speed"><span aria-hidden="true">🐢</span>
          <input id="speed" type="range" min="180" max="780" step="60" value="480" aria-label="Speed" />
          <span aria-hidden="true">🐇</span>
        </label>
      </div>
      <div class="board-wrap"><div class="board" id="board" role="img" aria-label="Mission map"></div></div>
      <div class="result-row">
        <p class="result" id="result" aria-live="polite"></p>
        <button class="btn btn-next" id="nextButton" type="button" hidden><span data-i18n="next">Next</span> ➜</button>
      </div>
      <div class="controls">
        <button class="btn btn-run" id="runButton" type="button">▶ <span data-i18n="run">Run</span></button>
        <button class="btn btn-soft" id="resetButton" type="button">↺ <span data-i18n="reset">Reset</span></button>
        <button class="btn btn-soft" id="restartButton" type="button">🧹 <span data-i18n="restart">Start over</span></button>
        <button class="btn btn-warm" id="answerButton" type="button">💡 <span data-i18n="answer">Answer</span></button>
      </div>
    </section>

    <section class="panel workspace-panel" aria-label="Code">
      <div class="workspace-head">
        <h2 data-i18n="workspace">Code</h2>
        <span class="chip" id="blockCount"></span>
      </div>
      <div class="quick-add" id="quickAdd"></div>
      <div id="blocklyDiv"></div>
      <p class="load-warning" id="loadWarning" data-i18n="loadWarning" hidden></p>
    </section>
  </main>

  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script type="module" src="src/quest/app.js"></script>
</body>
</html>
