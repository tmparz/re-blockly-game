<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Blocky Easy</title>
  <meta name="description" content="A touch-friendly coding path for kids: 100 levels, Blockly Games, Quest Lab missions and Story Lab projects." />
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/home.css" />
</head>
<body>
  <header class="site-bar" data-site-nav="student" data-current="map"></header>

  <main class="home wrap">
    <section class="home-hero card">
      <div>
        <p class="eyebrow" id="heroEyebrow">Blocky Easy</p>
        <h1 id="heroTitle">Your coding adventure</h1>
        <p id="heroText"></p>
      </div>
      <div class="hero-side">
        <div class="hero-stars"><span>⭐</span><strong id="heroStars">0</strong><small id="heroStarsLabel"></small></div>
        <a class="btn btn-primary hero-go" id="continueLink" href="levels.html"></a>
      </div>
    </section>

    <ol class="path" id="path"></ol>

    <section class="teacher-corner card" aria-labelledby="teacherTitle">
      <div>
        <p class="eyebrow">👩‍🏫 <span id="teacherEyebrow">For teachers</span></p>
        <h2 id="teacherTitle"></h2>
        <p id="teacherText"></p>
      </div>
      <nav class="teacher-links" id="teacherLinks"></nav>
    </section>
  </main>

  <footer class="site-footer"><div class="wrap" id="footerText"></div></footer>

  <script type="module" src="src/shared/site-nav.js"></script>
  <script type="module" src="src/home/app.js"></script>
</body>
</html>
