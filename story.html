<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Story Lab · Blocky Easy</title>
  <meta name="description" content="Make interactive stories and games with events, messages and a score — touch-friendly Blockly for Grade 3." />
  <link rel="stylesheet" href="styles/story.css" />
</head>
<body>
  <header class="topbar">
    <a class="home" href="./" title="100 Levels" aria-label="100 Levels">🏠</a>
    <span class="brand">🎬 <span>Story Lab</span></span>
    <nav class="task-nav" id="taskNav" aria-label="Challenges"></nav>
    <div class="top-right">
      <a class="icon-link" href="quest.html" title="Quest Lab">🧩</a>
      <a class="icon-link" href="course.html" title="Course Plan">📘</a>
      <button class="btn-present" id="presentButton" type="button">🎦 <span data-i18n="present">Present</span></button>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="panel stage-panel" aria-labelledby="taskTitle">
      <div class="task-head">
        <p class="kicker" id="taskKicker"></p>
        <h1 id="taskTitle"></h1>
        <p class="task-text" id="taskText"></p>
        <div class="goals">
          <p class="goals-title"><span id="goalsLabel">Goals</span> · <span id="goalCount"></span></p>
          <ul id="goalList"></ul>
        </div>
      </div>
      <div class="stage-wrap"><div class="stage" id="stage" aria-label="Story stage"></div></div>
      <div class="status-row">
        <p class="status" id="status" aria-live="polite"></p>
        <button class="btn btn-next" id="nextButton" type="button" hidden><span data-i18n="next">Next</span> ➜</button>
      </div>
      <div class="controls">
        <button class="btn btn-run" id="runButton" type="button">▶ <span data-i18n="run">Run</span></button>
        <button class="btn btn-stop" id="stopButton" type="button">⏹ <span data-i18n="stop">Stop</span></button>
        <button class="btn btn-soft" id="resetButton" type="button">↺ <span data-i18n="reset">Reset</span></button>
        <button class="btn btn-warm" id="exampleButton" type="button">💡 <span data-i18n="example">Example</span></button>
        <button class="btn btn-soft" id="clearButton" type="button">🧹 <span data-i18n="clear">Clear</span></button>
      </div>
      <div class="present-bar">
        <button class="btn btn-run" id="presentRun" type="button">▶ <span data-i18n="run">Run</span></button>
        <button class="btn btn-stop" id="presentStop" type="button">⏹ <span data-i18n="stop">Stop</span></button>
        <button class="btn btn-soft" id="presentExit" type="button">✕ <span data-i18n="exit">Exit</span></button>
      </div>
    </section>

    <section class="panel code-panel" aria-label="Code">
      <div class="code-head">
        <h2 data-i18n="code">Code</h2>
        <span class="chip" id="blockCount"></span>
      </div>
      <div class="category-tabs" id="categoryTabs" role="tablist"></div>
      <div class="quick-add" id="quickAdd"></div>
      <div id="blocklyDiv"></div>
      <p class="load-warning" id="loadWarning" hidden>Blockly could not load. Check the internet connection and refresh.</p>
    </section>
  </main>

  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script type="module" src="story.js"></script>
</body>
</html>
