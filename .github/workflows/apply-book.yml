name: Install Function Factory Book (temporary)
on:
  push:
    branches:
      - claude/book-function-factory
    paths:
      - 'book-factory.tar.bz2.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/book-function-factory
      - name: Extract submitted book sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, bz2, io, tarfile
          source = Path('book-factory.tar.bz2.b64')
          if not source.exists():
              print('No archive to unpack; skipping.')
              raise SystemExit(0)
          data = bz2.decompress(base64.b64decode(source.read_text().strip(), validate=True))
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:') as tar:
              for entry in tar.getmembers():
                  path = Path(entry.name)
                  if path.is_absolute() or '..' in path.parts or not entry.isfile():
                      raise ValueError('Invalid tar member: ' + entry.name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(tar.extractfile(entry).read())
          source.unlink()
          PY
      - name: Verify and commit source files
        run: |
          npm run check
          node scripts/build-static.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m 'Add Function Factory interactive book (missions 1-20)'
            git push origin HEAD:claude/book-function-factory
          fi
